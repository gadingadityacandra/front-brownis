<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5A2B" />
      <stop offset="100%" stop-color="#5C4033" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F3E1E4" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#3A2820" flood-opacity="0.5"/>
    </filter>
  </defs>
  
  <!-- Background Rounded Square -->
  <rect width="100" height="100" rx="30" ry="30" fill="url(#bgGrad)" />
  
  <!-- Decorative Inner Border -->
  <rect x="6" y="6" width="88" height="88" rx="25" ry="25" fill="none" stroke="#D4A5A5" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6" />
  
  <!-- "IB" Monogram -->
  <text x="50%" y="54%" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="46" fill="url(#textGrad)" text-anchor="middle" dominant-baseline="middle" letter-spacing="-2" filter="url(#shadow)">
    IB
  </text>
  
  <!-- Small Elegant Dot -->
  <circle cx="50" cy="82" r="2.5" fill="#D4A5A5" />
</svg>
